<head>
<title>Restaurant Analytics Dashboard</title>

<style>
body {
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

header {
    text-align: center;
    color: #00CC96;
    padding: 20px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
}

.chart {
    background: #1F2937;
    padding: 10px;
    border-radius: 12px;
    min-width: 0;
}

.chart:last-child {
    grid-column: 1 / -1;
}

@media(max-width: 800px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
    .chart:last-child {
        grid-column: auto;
    }
}
</style>
</head>
